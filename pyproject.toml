[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bounty-concierge"
version = "0.1.0"
description = "RustChain bounty ecosystem concierge - find, claim, and track bounties"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Elyan Labs", email = "scott@elyanlabs.ai"}]
dependencies = ["requests>=2.32.5"]

[project.scripts]
concierge = "concierge.cli:main"

[tool.setuptools.packages.find]
include = ["concierge*"]
